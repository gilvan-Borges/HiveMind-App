name: CodeQL

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - ".specify/**"
      - ".agents/**"
      - "*.md"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - ".specify/**"
      - ".agents/**"
      - "*.md"
      - "LICENSE"
  schedule:
    - cron: "27 4 * * 1"
  workflow_dispatch:

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Sem setup-gradle: cache do Gradle esconde o compile e o CodeQL fica cego.
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build (CodeQL tracing)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-build-cache --rerun-tasks clean assembleDebug

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
