# Publica GitHub Release automaticamente no HiveMind-App quando o CI da main passar
# e houver alteração real em código/recursos de produção (ignorando docs, specs, testes e chore).
name: Release

on:
  workflow_run:
    workflows: ["HiveMind-App Android CI"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  detect:
    name: Detector de Release
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - name: Checkout do commit aprovado pelo CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Avaliar se o commit exige nova Release
        id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "reason=Disparo manual (workflow_dispatch)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          subject="$(git log -1 --pretty=%s)"
          body="$(git log -1 --pretty=%B)"
          echo "Commit: ${subject}"

          # 1. Marcadores explícitos para pular release
          if echo "${body}" | grep -qiE '\[(skip release|no release|release skip)\]'; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "reason=Marcador [skip release] no commit" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 2. Prefixos Conventional Commits que não alteram o APK de produção
          if echo "${subject}" | grep -qiE '^(docs|test|tests|chore|ci|style)(\([^)]*\))?!?:'; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "reason=Commit de docs/test/chore/ci (${subject})" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 3. Inspeção dos arquivos alterados: ignora docs, specs, testes unitários e metadados
          changed="$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)"
          if [ -z "${changed}" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "reason=Sem diff anterior disponível" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          prod_files="$(echo "${changed}" | grep -vE '^(docs/|\.specify/|\.agents/|\.github/|app/src/test/|README\.md$|SECURITY\.md$|AGENTS\.md$|LICENSE$|\.gitignore$|.*\.md$)' || true)"
          if [ -z "${prod_files}" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "reason=Apenas documentação, specs ou testes foram alterados" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Arquivos de produção alterados:"
          echo "${prod_files}"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "reason=Arquivos do app Android alterados" >> "$GITHUB_OUTPUT"

  build-and-publish:
    name: Build APK & Publicar Release
    needs: [detect]
    if: needs.detect.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout do commit aprovado pelo CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Metadados da release
        id: meta
        shell: bash
        run: |
          version="$(grep -oE 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | head -n1 | cut -d'"' -f2)"
          if [ -z "${version}" ]; then version="0.2.0"; fi
          full_sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=8 HEAD)"
          tag="v${version}-${short_sha}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "full_sha=${full_sha}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Compilar APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk "release-assets/hivemind-mobile-v${{ steps.meta.outputs.version }}-debug.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "release-assets/hivemind-mobile-v${{ steps.meta.outputs.version }}-release.apk"
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk "release-assets/hivemind-mobile-v${{ steps.meta.outputs.version }}-release-unsigned.apk"
          fi
          (cd release-assets && sha256sum *.apk > checksums.txt)

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: HiveMind Mobile v${{ steps.meta.outputs.version }} (${{ steps.meta.outputs.short_sha }})
          target_commitish: ${{ steps.meta.outputs.full_sha }}
          generate_release_notes: true
          make_latest: true
          body: |
            Build automático da `main` após CI Android verde.

            - Versão: `${{ steps.meta.outputs.version }}`
            - Commit: `${{ steps.meta.outputs.short_sha }}`

            ### Android APK
            - `hivemind-mobile-v${{ steps.meta.outputs.version }}-debug.apk` — APK assinado pronto para instalar no Android
            - `checksums.txt` — hashes SHA-256 dos artefatos
          files: |
            release-assets/**
